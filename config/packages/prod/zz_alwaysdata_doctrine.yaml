doctrine:
    dbal:
        # Configuration specifique a Alwaysdata : MariaDB 11.4 accepte utf8,
        # ce qui evite l'erreur "Unknown character set" au moment de la connexion.
        url: '%env(resolve:DATABASE_URL)%'
        server_version: 'mariadb-11.4.0'
        charset: 'utf8'
        default_table_options:
            charset: 'utf8'
            collate: 'utf8_general_ci'
